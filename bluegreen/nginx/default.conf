# El color activo se define en /etc/nginx/active/*.conf (lo reescribe switch.sh)
upstream petclinic {
    include /etc/nginx/active/upstream.conf;
}

server {
    listen 80;

    # Cabecera para ver qué color atendió cada petición
    include /etc/nginx/active/color.conf;

    location / {
        proxy_pass http://petclinic;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
    }
}
