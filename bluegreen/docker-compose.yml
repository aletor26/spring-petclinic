# Despliegue Blue-Green de Spring PetClinic con Docker Compose
#   proxy  -> Nginx, único punto de entrada (http://localhost:8080)
#   blue   -> versión A de la app (directo: http://localhost:8081)
#   green  -> versión B de la app (directo: http://localhost:8082)
#   db     -> PostgreSQL compartido por ambas versiones
name: petclinic-bg

x-app: &app
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  environment: &app-env
    SPRING_PROFILES_ACTIVE: postgres
    POSTGRES_URL: jdbc:postgresql://db:5432/petclinic
    POSTGRES_USER: petclinic
    POSTGRES_PASS: petclinic
    SPRING_DOCKER_COMPOSE_ENABLED: "false"
    MANAGEMENT_INFO_ENV_ENABLED: "true"
  healthcheck:
    test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
    interval: 5s
    timeout: 3s
    retries: 5
    start_period: 60s

services:
  db:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: petclinic
      POSTGRES_PASSWORD: petclinic
      POSTGRES_DB: petclinic
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petclinic -d petclinic"]
      interval: 5s
      timeout: 3s
      retries: 10

  app-blue:
    <<: *app
    image: petclinic:blue
    container_name: petclinic-blue
    ports: ["8081:8080"]
    environment:
      <<: *app-env
      INFO_APP_COLOR: blue
      INFO_APP_VERSION: ${BLUE_VERSION:-v1}

  app-green:
    <<: *app
    image: petclinic:green
    container_name: petclinic-green
    ports: ["8082:8080"]
    environment:
      <<: *app-env
      INFO_APP_COLOR: green
      INFO_APP_VERSION: ${GREEN_VERSION:-v1}

  proxy:
    image: nginx:1.27-alpine
    container_name: petclinic-proxy
    restart: unless-stopped
    ports: ["8080:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/active:/etc/nginx/active:ro
    depends_on:
      - app-blue

volumes:
  pgdata:
