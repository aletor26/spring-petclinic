# Línea base (tarea 3, Cap. V R2): alternativa A bien configurada.
# Umbrales fijos + Alertmanager (agrupación, deduplicación e inhibición en
# values/kube-prometheus-stack.yaml). Es el escenario "antes" contra el que se compara el analizador.
#
# Todas las alertas llevan la etiqueta `version` (PostgresDown usa version="todas", porque la
# base es compartida por blue y green). Se aplica con: k8s/observability/obs.sh rules
#
# Los umbrales de latencia se calibran con 3+ corridas sanas:
#   python3 k8s/observability/baseline/linea_base.py calibrar --csv docs/calibracion.csv
# El script reescribe solo el bloque entre "BEGIN umbrales-latencia" y "END umbrales-latencia".
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: petclinic-linea-base
  namespace: monitoring
spec:
  groups:
    # ------------------------------------------------------------------ SLI / SLO
    - name: petclinic-slo
      interval: 15s
      rules:
        # Disponibilidad: respuestas no 5xx. Se excluyen /oups (error provocado) y /actuator
        # (las sondas de Kubernetes inflarían el denominador).
        - record: petclinic:requests:rate2m
          expr: |
            sum by (version) (rate(http_server_requests_seconds_count{namespace="petclinic", uri!~"/oups|/actuator.*"}[2m]))
        - record: petclinic:errors_5xx:rate2m
          expr: |
            sum by (version) (rate(http_server_requests_seconds_count{namespace="petclinic", uri!~"/oups|/actuator.*", status=~"5.."}[2m]))
        - record: petclinic:error_ratio:rate2m
          expr: |
            petclinic:errors_5xx:rate2m / petclinic:requests:rate2m
        # Se calcula como "no 5xx / total" y no como "1 - 5xx / total": si no hubo ningún 5xx,
        # la serie de errores no existe y la resta daría vacío en vez de 1.
        - record: petclinic:availability:ratio_rate10m
          expr: |
            sum by (version) (rate(http_server_requests_seconds_count{namespace="petclinic", uri!~"/oups|/actuator.*", status!~"5.."}[10m]))
            /
            sum by (version) (rate(http_server_requests_seconds_count{namespace="petclinic", uri!~"/oups|/actuator.*"}[10m]))
        # Registro de visitas exitoso (SLO >= 99,5 %).
        - record: petclinic:visit_success:ratio_rate10m
          expr: |
            sum by (version) (rate(http_server_requests_seconds_count{namespace="petclinic", method="POST", uri="/owners/{ownerId}/pets/{petId}/visits/new", status!~"5.."}[10m]))
            /
            sum by (version) (rate(http_server_requests_seconds_count{namespace="petclinic", method="POST", uri="/owners/{ownerId}/pets/{petId}/visits/new"}[10m]))
        # Latencia p95 por ruta y versión.
        - record: petclinic:latency_p95_seconds:rate2m
          expr: |
            histogram_quantile(0.95,
              sum by (le, uri, version) (rate(http_server_requests_seconds_bucket{namespace="petclinic", uri!~"/oups|/actuator.*"}[2m])))

    # ------------------------------------------------------------------ umbrales de latencia
    # Umbral = p95 sano × 1,5 por ruta. Los valores de abajo son PROVISIONALES hasta calibrar.
    - name: petclinic-umbrales
      interval: 30s
      rules:
        # BEGIN umbrales-latencia
        - record: petclinic:slo_latency_p95_threshold_seconds
          expr: vector(0.5)
          labels: {uri: "/"}
        - record: petclinic:slo_latency_p95_threshold_seconds
          expr: vector(0.5)
          labels: {uri: "/vets.html"}
        - record: petclinic:slo_latency_p95_threshold_seconds
          expr: vector(0.5)
          labels: {uri: "/owners"}
        - record: petclinic:slo_latency_p95_threshold_seconds
          expr: vector(0.5)
          labels: {uri: "/owners/find"}
        - record: petclinic:slo_latency_p95_threshold_seconds
          expr: vector(0.5)
          labels: {uri: "/owners/{ownerId}"}
        - record: petclinic:slo_latency_p95_threshold_seconds
          expr: vector(0.5)
          labels: {uri: "/owners/{ownerId}/pets/{petId}/visits/new"}
        # END umbrales-latencia

    # ------------------------------------------------------------------ alertas
    - name: petclinic-alertas
      interval: 15s
      rules:
        - alert: PetclinicHighErrorRate
          # 5xx > 1 % (sin /oups). Exige algo de tráfico para no alertar por 1 error en 3 solicitudes.
          expr: |
            petclinic:error_ratio:rate2m > 0.01
            and petclinic:requests:rate2m > 0.1
          for: 2m
          labels: {severity: critical, linea_base: "si"}
          annotations:
            summary: "Errores 5xx {{ $value | humanizePercentage }} en la versión {{ $labels.version }}"

        - alert: PetclinicHighLatency
          # p95 de una ruta por encima de su umbral (p95 sano × 1,5). Solo rutas con tráfico.
          expr: |
            (
              petclinic:latency_p95_seconds:rate2m
              > on (uri) group_left ()
              petclinic:slo_latency_p95_threshold_seconds
            )
            and on (uri, version)
            sum by (uri, version) (rate(http_server_requests_seconds_count{namespace="petclinic"}[2m])) > 0.05
          for: 2m
          labels: {severity: warning, linea_base: "si"}
          annotations:
            summary: "p95 de {{ $labels.uri }} = {{ $value | humanizeDuration }} en la versión {{ $labels.version }}"

        - alert: PetclinicPoolSaturated
          # Hay hilos esperando conexión: el pool de Hikari (10 conexiones) está agotado.
          expr: |
            max by (pod, version) (hikaricp_connections_pending{namespace="petclinic"}) > 0
          for: 1m
          labels: {severity: warning, linea_base: "si"}
          annotations:
            summary: "Pool de conexiones saturado en {{ $labels.pod }} (versión {{ $labels.version }})"

        - alert: PetclinicHeapHigh
          # Heap usado > 85 % del máximo. "> 0" descarta las áreas sin máximo definido (-1).
          expr: |
            sum by (pod, version) (jvm_memory_used_bytes{namespace="petclinic", area="heap"})
            /
            sum by (pod, version) (jvm_memory_max_bytes{namespace="petclinic", area="heap"} > 0)
            > 0.85
          for: 5m
          labels: {severity: warning, linea_base: "si"}
          annotations:
            summary: "Heap al {{ $value | humanizePercentage }} en {{ $labels.pod }} (versión {{ $labels.version }})"

        - alert: PetclinicDown
          # Prometheus no puede leer el pod. Se ignoran los primeros 3 min de vida del pod: al
          # arrancar una versión nueva el endpoint todavía no responde y no es una falla.
          expr: |
            (up{namespace="petclinic"} == 0)
            and on (pod)
            (time() - max by (pod) (kube_pod_start_time{namespace="petclinic"}) > 180)
          for: 1m
          labels: {severity: critical, linea_base: "si"}
          annotations:
            summary: "Prometheus no puede leer {{ $labels.pod }} (versión {{ $labels.version }})"

        - alert: PostgresDown
          # Sin réplicas listas de PostgreSQL (kube-state-metrics). La base es compartida.
          # Al escalar a 0 la serie sigue existiendo con valor 0. No se usa absent(): un reinicio
          # de kube-state-metrics daría un falso PostgresDown.
          expr: |
            label_replace(
              max by (statefulset) (kube_statefulset_status_replicas_ready{namespace="petclinic", statefulset="petclinic-db"}) < 1,
              "version", "todas", "", "")
          for: 1m
          labels: {severity: critical, linea_base: "si"}
          annotations:
            summary: "PostgreSQL sin réplicas listas: afecta a las dos versiones"

        - alert: PetclinicPodRestarts
          # Reinicios del contenedor en los últimos 10 min. La versión sale de la etiqueta del pod
          # (kube_pod_labels; requiere metricLabelsAllowlist en kube-state-metrics).
          expr: |
            (
              sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total{namespace="petclinic", container="petclinic"}[10m])) > 0
            )
            * on (namespace, pod) group_left (version)
            max by (namespace, pod, version) (
              label_replace(kube_pod_labels{namespace="petclinic", label_app="petclinic"}, "version", "$1", "label_version", "(.+)")
            )
          labels: {severity: warning, linea_base: "si"}
          annotations:
            summary: "{{ $labels.pod }} se reinició (versión {{ $labels.version }})"
