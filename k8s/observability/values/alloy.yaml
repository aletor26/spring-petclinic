# Grafana Alloy: lee los logs de los pods de PetClinic (y del receptor de alertas)
# con la API de Kubernetes y los envía a Loki, conservando la versión de cada pod.
# También envía los eventos del namespace petclinic (deploy, promote, abort del Rollout),
# que el dashboard usa como anotaciones.
controller:
  type: deployment
  replicas: 1

alloy:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}
  configMap:
    content: |-
      discovery.kubernetes "pods" {
        role = "pod"
        namespaces {
          names = ["petclinic", "monitoring"]
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        // Solo la app y el receptor de alertas
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          regex         = "petclinic|alert-sink"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
        }
        // Sin estas dos etiquetas no se pueden separar blue y green
        rule {
          source_labels = ["__meta_kubernetes_pod_label_version"]
          target_label  = "version"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_rollouts_pod_template_hash"]
          target_label  = "rollouts_pod_template_hash"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.level.receiver]
      }

      // Los logs de la app salen en JSON (ECS). El nivel se vuelve etiqueta para filtrar errores.
      loki.process "level" {
        stage.json {
          expressions = { level = "log.level" }
        }
        stage.labels {
          values = { level = "" }
        }
        forward_to = [loki.write.local.receiver]
      }

      loki.source.kubernetes_events "events" {
        namespaces = ["petclinic"]
        forward_to = [loki.write.local.receiver]
      }

      loki.write "local" {
        endpoint {
          url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
        }
      }
