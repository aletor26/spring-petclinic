# Verificación ANTES de pasar el tráfico a la versión nueva (prePromotionAnalysis).
# Las métricas corren en paralelo; si alguna falla, Argo aborta y el tráfico
# sigue en la versión estable.
#
#   smoke-tests -> páginas clave responden 200 (rápido)
#   k6-window   -> durante la ventana (10m por defecto) k6 envía el MISMO tráfico
#                  a active y preview, incluido el flujo de registrar una visita.
#                  Falla si preview supera 1% de errores o 1% de checks fallidos.
#                  Guarda cada solicitud en el PVC k6-results (JSON comprimido).
#
# Integración con el analizador AIOps (otro equipo): agregar aquí una métrica
# "web" que llame a su API y apruebe solo si el puntaje >= 75. Ejemplo:
#
#   - name: aiops-score
#     provider:
#       web:
#         url: "http://aiops-analyzer.aiops.svc/verdict?preview={{args.preview-hash}}&stable={{args.stable-hash}}"
#         jsonPath: "{$.score}"
#     successCondition: result >= 75
#
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: smoke-tests
  namespace: petclinic
spec:
  args:
    - name: service
    - name: window
      value: 10m
    - name: preview-version
    - name: fault
    - name: stable-hash
    - name: preview-hash
  metrics:
    - name: smoke-tests
      count: 1
      failureLimit: 0
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: smoke
                    image: curlimages/curl:8.11.1
                    command: ["sh", "-c"]
                    args:
                      - |
                        fail=0
                        for p in /actuator/health / /vets.html "/owners?lastName=" /owners/1 /owners/find; do
                          code=$(curl -s -o /dev/null -w '%{http_code}' "http://{{args.service}}$p")
                          echo "$p -> $code"
                          [ "$code" = 200 ] || fail=1
                        done
                        exit $fail
    - name: k6-window
      count: 1
      failureLimit: 0
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                securityContext:
                  runAsUser: 0          # para escribir en el volumen local-path
                containers:
                  - name: k6
                    image: grafana/k6:0.57.0
                    command: ["sh", "-c"]
                    args:
                      - |
                        f="/results/$(date +%Y%m%d-%H%M%S)_{{args.preview-version}}_preview-{{args.preview-hash}}_stable-{{args.stable-hash}}.json.gz"
                        echo "Ventana {{args.window}} -> $f"
                        k6 run --quiet --out "json=$f" /scripts/load.js
                    env:
                      - name: DURATION
                        value: "{{args.window}}"
                      - name: FAULT
                        value: "{{args.fault}}"
                      - name: ACTIVE_URL
                        value: http://petclinic-active.petclinic.svc.cluster.local
                      - name: PREVIEW_URL
                        value: http://petclinic-preview.petclinic.svc.cluster.local
                    volumeMounts:
                      - {name: script, mountPath: /scripts}
                      - {name: results, mountPath: /results}
                volumes:
                  - name: script
                    configMap:
                      name: k6-script
                  - name: results
                    persistentVolumeClaim:
                      claimName: k6-results
