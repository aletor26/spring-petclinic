# Argo Rollouts decide a qué versión apunta cada Service
# (agrega el selector rollouts-pod-template-hash automáticamente).
#   petclinic-active  -> versión que reciben los usuarios  (localhost:8080)
#   petclinic-preview -> versión nueva en prueba           (localhost:8081)
apiVersion: v1
kind: Service
metadata:
  name: petclinic-active
  namespace: petclinic
spec:
  type: NodePort
  selector:
    app: petclinic
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: petclinic-preview
  namespace: petclinic
spec:
  type: NodePort
  selector:
    app: petclinic
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30081
