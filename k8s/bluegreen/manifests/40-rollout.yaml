# PetClinic con estrategia Blue-Green (Argo Rollouts).
# Cada versión nueva se levanta en "preview", pasa el análisis y espera
# la promoción manual. La versión anterior queda viva 10 min para rollback.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: petclinic
  namespace: petclinic
spec:
  replicas: 2                  # dos réplicas por versión (R1)
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: petclinic
  template:
    metadata:
      labels:
        app: petclinic
        version: v1            # lo actualiza bg.sh deploy (sirve para separar métricas por versión)
      annotations:             # trazabilidad: lo actualiza bg.sh deploy
        petclinic/commit: "none"
        petclinic/image: "none"
    spec:
      initContainers:
        - name: wait-db             # no arrancar la app hasta que PostgreSQL acepte conexiones
          image: postgres:18.4
          command: ["sh", "-c", "until pg_isready -h petclinic-db -U petclinic; do sleep 2; done"]
      containers:
        - name: petclinic
          image: localhost:5001/petclinic:v1   # bg.sh lo reemplaza por la imagen fijada por digest (@sha256:...)
          imagePullPolicy: IfNotPresent
          env:
            - name: INFO_APP_VERSION       # índice 0: lo actualiza bg.sh deploy
              value: v1
            - name: SPRING_PROFILES_ACTIVE
              value: postgres
            - name: SPRING_SQL_INIT_MODE          # la base la inicializa el Job petclinic-db-init
              value: never
            - name: POSTGRES_URL
              value: jdbc:postgresql://petclinic-db:5432/petclinic
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: petclinic-db, key: POSTGRES_USER}}
            - name: POSTGRES_PASS
              valueFrom: {secretKeyRef: {name: petclinic-db, key: POSTGRES_PASSWORD}}
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE   # solo lo necesario (R1); antes exponía todo (*)
              value: health,info,prometheus
            - name: MANAGEMENT_INFO_ENV_ENABLED
              value: "true"
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
            - name: SPRING_DOCKER_COMPOSE_ENABLED
              value: "false"
            - name: LOGGING_STRUCTURED_FORMAT_CONSOLE   # logs en JSON (ECS) para que Alloy/Loki los lean por campos
              value: ecs
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 768Mi}
  strategy:
    blueGreen:
      activeService: petclinic-active
      previewService: petclinic-preview
      autoPromotionEnabled: false     # una persona (o luego la IA) decide promover
      scaleDownDelaySeconds: 600      # la versión anterior queda viva 10 min para rollback
      prePromotionAnalysis:
        templates:
          - templateName: smoke-tests
        args:
          - name: service
            value: petclinic-preview.petclinic.svc.cluster.local
          - name: window                 # índice 1: duración de la ventana (bg.sh deploy --window)
            value: 10m
          - name: preview-version        # índice 2: lo actualiza bg.sh deploy
            value: v1
          - name: stable-hash
            valueFrom:
              podTemplateHashValue: Stable
          - name: preview-hash
            valueFrom:
              podTemplateHashValue: Latest
